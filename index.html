<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interventometro GDL - Cloud & Analytics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK (v9 Compat version for standard script integration) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        .gdl-card {
            transition: all 0.15s ease-in-out;
        }
        .gdl-card:active {
            transform: scale(0.97);
        }
        .tab-btn.active {
            border-bottom: 3px solid #3b82f6;
            color: #1d4ed8;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- TOP HEADER / NAVBAR -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fa-solid fa-chart-simple text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Interventometro GDL</h1>
                    <p class="text-xs text-slate-400" id="syncStatus">
                        <i class="fa-solid fa-cloud text-emerald-400 mr-1"></i>Sincronizzato Cloud / Locale
                    </p>
                </div>
            </div>

            <!-- TABS NAVIGATION -->
            <div class="flex bg-slate-800 p-1 rounded-lg text-sm font-medium">
                <button id="tabLiveBtn" onclick="switchTab('live')" class="tab-btn active px-4 py-1.5 rounded-md transition-all">
                    <i class="fa-solid fa-hand-pointer mr-2"></i>Live Class
                </button>
                <button id="tabStatsBtn" onclick="switchTab('stats')" class="tab-btn px-4 py-1.5 rounded-md text-slate-300 hover:text-white transition-all">
                    <i class="fa-solid fa-chart-pie mr-2"></i>Dashboard Statistiche
                </button>
            </div>

            <!-- GLOBAL COUNTER & SETTINGS -->
            <div class="flex items-center space-x-3">
                <div class="bg-slate-800 px-3 py-1.5 rounded-lg text-right border border-slate-700">
                    <span class="text-xs text-slate-400 block uppercase font-semibold">Totale Interventi</span>
                    <span id="globalCountHeader" class="text-xl font-bold text-blue-400">0</span>
                </div>
                <button onclick="toggleSettingsModal()" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 transition-colors" title="Impostazioni / Firebase">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- ================= TAB 1: LIVE INTERVENTOMETRO ================= -->
        <div id="tabLive" class="space-y-6">
            
            <!-- CONTROLS & LESSON TITLE BAR -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                <div class="flex-1 min-w-[280px]">
                    <label class="text-xs font-semibold text-slate-500 uppercase block mb-1">Nome / Titolo Lezione Attuale</label>
                    <div class="relative">
                        <input type="text" id="lessonTitleInput" placeholder="es. Lezione 12 - Presentazioni di Gruppo" 
                               class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
                        <i class="fa-solid fa-pen text-slate-400 absolute left-3 top-3 text-xs"></i>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="undoLastAction()" id="undoBtn" disabled class="px-3 py-2 bg-slate-100 text-slate-400 rounded-lg text-sm font-medium transition-colors flex items-center space-x-1 border border-slate-200 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span>Annulla</span>
                    </button>
                    <button onclick="archiveLesson()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-semibold transition-colors flex items-center space-x-1 shadow-sm">
                        <i class="fa-solid fa-box-archive"></i>
                        <span>Archivia Lezione</span>
                    </button>
                    <button onclick="confirmResetCurrent()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-sm font-medium transition-colors flex items-center space-x-1 border border-rose-200" title="Azzera sessione live">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <span>Azzera Live</span>
                    </button>
                </div>
            </div>

            <!-- TWO COLUMN LAYOUT (SX: GDL BUTTONS | DX: QUICK SUMMARY) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                <!-- SX COLUMN: 12 GDL (GRID SPLIT BY 3 SECTIONS) -->
                <div class="lg:col-span-7 space-y-6">

                    <!-- SEZIONE 1 (GDL 1-4) -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-blue-500 border border-slate-200">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="font-bold text-slate-700 text-sm flex items-center">
                                <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs mr-2 font-bold">1^ SEZIONE</span>
                                GDL da 1 a 4
                            </h2>
                            <span class="text-xs text-slate-500 font-semibold" id="sec1Total">0 Interventi</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <script>
                                for(let i=1; i<=4; i++) {
                                    document.write(`
                                        <div class="gdl-card bg-slate-50 rounded-lg p-3 border border-slate-200 hover:border-blue-300 flex flex-col justify-between shadow-xs">
                                            <div class="flex justify-between items-start mb-2">
                                                <span class="font-bold text-slate-700">GDL ${i}</span>
                                                <span id="count-gdl-${i}"
